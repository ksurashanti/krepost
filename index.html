<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<!--build:202610292140-->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<title>Крепость Чембало</title>
<meta name="description" content="Роли, комнаты, пир и дорога для гостей дня рождения Ксении">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: мобильное приложение: тёмная шапка, полоса контактов, одна вкладка на экране, панель вкладок снизу */
:root{
  --paper:#F1F0EB; --surface:#FAFAF5; --ink:#23261E; --muted:#676B5A; --line:#D7D5C8;
  --olive:#3C4F12; --olive-2:#76913A; --sage:#A9BC7E; --sand:#E6DDBA; --shield:#D9CF9C;
  --top-bg:#E6DDBA; --top-ink:#23261E; --top-accent:#3C4F12;
  --night:#1E2414; --on-night:#F1F0EB; --on-olive:#F3F1E6; --warn:#8A4B1E; --warn-bg:#F3E4CC;
  --d1:#E6DDBA; --d2:#CFDBAE; --d3:#DCDFD2;
  --f:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:14px; --tabbar:64px; --plan-dark:#23261E; --plan-wall:#23261E;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#15170F; --surface:#1E2118; --ink:#ECEADF; --muted:#A3A692; --line:#33372A;
  --olive:#A9BC7E; --olive-2:#8EA65A; --sage:#4D5E33; --sand:#3A3726; --shield:#4A4630;
  --top-bg:#0F120A; --top-ink:#ECEADF; --top-accent:#8EA65A;
  --night:#0F120A; --on-night:#ECEADF; --on-olive:#15170F; --warn:#E3B37E; --warn-bg:#3A2D1C;
  --d1:#3A3726; --d2:#33402A; --d3:#2C2F27; --plan-dark:#0B0D07; --plan-wall:#8C907C; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#15170F; --surface:#1E2118; --ink:#ECEADF; --muted:#A3A692; --line:#33372A;
  --olive:#A9BC7E; --olive-2:#8EA65A; --sage:#4D5E33; --sand:#3A3726; --shield:#4A4630;
  --top-bg:#0F120A; --top-ink:#ECEADF; --top-accent:#8EA65A;
  --night:#0F120A; --on-night:#ECEADF; --on-olive:#15170F; --warn:#E3B37E; --warn-bg:#3A2D1C;
  --d1:#3A3726; --d2:#33402A; --d3:#2C2F27; --plan-dark:#0B0D07; --plan-wall:#8C907C; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font:16px/1.45 var(--f);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;font-weight:700;line-height:1.15;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--olive-2);outline-offset:2px}
.muted{color:var(--muted)} .small{font-size:14px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--olive)}

/* шапка */
.top{background:var(--top-bg);color:var(--top-ink);padding:18px 16px 16px}
.top .in{max-width:720px;margin:0 auto;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.top .eyebrow{color:var(--top-accent)}
.top h1{font-size:clamp(26px,7vw,34px);font-weight:800;margin-top:4px}
.top .now{font-size:14px;color:var(--top-accent);text-align:right;min-width:0}
.top .now b{display:block;color:var(--top-ink);font-size:16px;font-weight:600}
.sync{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--sage);margin-right:6px;vertical-align:middle;animation:pulse 1s infinite alternate}
@keyframes pulse{from{opacity:.25}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.sync{animation:none}}

/* контакты */
.contacts{max-width:720px;margin:0 auto;display:flex;gap:8px;overflow-x:auto;padding:12px 16px 4px;scrollbar-width:none}
.contacts::-webkit-scrollbar{display:none}
.ct{flex:none;display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 6px 5px 6px}
.ct .who{display:grid;line-height:1.15;min-width:0}
.ct .who b{font-size:14px;font-weight:600}
.ct .who span{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:130px}
.ct .acts{display:flex;gap:4px}
.ic{width:34px;height:34px;border-radius:50%;border:0;display:grid;place-items:center;cursor:pointer;background:var(--paper);color:var(--olive)}
.ic.tg{background:var(--olive);color:var(--on-olive)}
.ic svg{width:18px;height:18px}

.wrap{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:8px calc(var(--tabbar) + 32px + env(safe-area-inset-bottom,0px))}
.view{display:grid;gap:16px;padding-top:12px}
.view > *{min-width:0}
.view > h2{font-size:26px;font-weight:800}
.sub{display:grid;gap:4px}

/* панель вкладок */
nav.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabbar .in{max-width:720px;margin:0 auto;display:flex;height:var(--tabbar)}
nav.tabbar a{flex:1;display:grid;justify-items:center;align-content:center;gap:3px;text-decoration:none;color:var(--muted);font-size:11.5px;font-weight:500;min-width:0}
nav.tabbar a svg{width:24px;height:24px}
nav.tabbar a.off{opacity:.35;cursor:not-allowed}
nav.tabbar a.on{color:var(--olive);font-weight:700}
nav.tabbar a.on .pill{background:color-mix(in srgb,var(--olive) 16%,transparent)}
nav.tabbar .pill{display:grid;place-items:center;width:52px;height:28px;border-radius:999px}

/* аватар-камея: овал с двойной рамкой */
.av{--w:44px;width:var(--w);height:calc(var(--w)*1.2);flex:none;position:relative;display:grid;place-items:center;background:var(--olive);border-radius:50%}
.av::before{content:"";position:absolute;inset:calc(var(--w)*.045);background:var(--shield);border-radius:50%}
.av span{position:relative;font-weight:700;font-size:calc(var(--w)*.42);color:var(--olive)}
.av .ph{position:absolute;inset:calc(var(--w)*.09);border-radius:50%;overflow:hidden;background:var(--shield);box-shadow:0 0 0 1px var(--olive)}
.av .ph img{display:block;width:100%;height:100%;object-fit:cover;transform:scale(1.2);transform-origin:50% 37%}
.av.xl .ph img,.lb .av .ph img{transform:none}
.av:has(img){cursor:zoom-in} button .av{cursor:inherit}
.lb{position:fixed;inset:0;z-index:60;background:rgba(18,22,10,.94);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:grid;place-items:center;align-content:center;gap:6px;padding:24px;text-align:center;cursor:zoom-out;animation:lbin .18s ease-out}
.lb .av{--w:min(70vw,300px);margin-bottom:12px;cursor:zoom-out}
.lb b{color:var(--on-night);font-size:20px} .lb .r{color:var(--sage);font-size:15px}
.lb .acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:14px}
.lb .go.yes{background:var(--olive);border-color:var(--olive);color:var(--on-olive)}
.ask{display:flex;align-items:center;gap:10px;width:100%;margin-top:8px;padding:10px 12px;border:1px dashed var(--warn);border-radius:12px;background:var(--warn-bg);color:var(--warn);font:inherit;font-size:14px;text-align:left;cursor:pointer}
.ask b{display:grid;place-items:center;flex:none;width:26px;height:26px;border-radius:50%;background:var(--warn);color:var(--warn-bg);font-size:16px}
.lb .go svg{width:18px;height:18px}
.lb .go{display:inline-flex;align-items:center;gap:7px;text-decoration:none;border:1px solid var(--sage);color:var(--on-night);background:none;border-radius:999px;padding:9px 18px;font:inherit;font-size:14px;cursor:pointer}
@keyframes lbin{from{opacity:0}to{opacity:1}}
.av.xl{--w:96px} .av.sm{--w:30px} .av.xs{--w:24px}


/* мини-игра */
.mg{position:fixed;inset:0;z-index:80;background:#120e0c;display:grid;place-items:center;touch-action:none;user-select:none;-webkit-user-select:none}
.mg canvas{display:block;touch-action:none;image-rendering:pixelated}
.mg-x{position:absolute;bottom:calc(14px + env(safe-area-inset-bottom));right:14px;border:0;background:rgba(18,14,12,.6);color:#e8e2d2;font-size:18px;width:34px;height:34px;border-radius:50%;cursor:pointer;z-index:2}
.mg-over{position:absolute;inset:0;display:none;place-items:center;background:rgba(18,14,12,.6);padding:20px}
.mg-card{background:#f4ecd6;color:#2a1e14;border:3px solid #5a3a1e;box-shadow:0 0 0 3px #120e0c,0 10px 30px rgba(0,0,0,.5);border-radius:14px;padding:20px 18px;max-width:330px;display:grid;gap:10px;text-align:center}
.mg-card b{font-size:24px}.mg-card p{margin:0;line-height:1.45}.mg-small{font-size:14px;color:#6a5a44}
.mg-warn{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:#ffd75e;color:#120e0c;font-size:16px!important}
.mg-big{font-size:64px;font-weight:800;color:#7a1c24;line-height:1}
.mg-btn{padding:13px 18px;border:0;border-radius:999px;background:#7a1c24;color:#f4ecd6;font:inherit;font-weight:700;font-size:16px;cursor:pointer}
.mg-btn.ghost{background:none;border:2px solid #7a1c24;color:#7a1c24}
/* викторины */
.qgroup{padding:0}
.qgroup>summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px}
.qgroup>summary::-webkit-details-marker{display:none}
.qgroup>summary>span{display:grid;gap:2px}
.qgroup>summary b{font-size:17px}
.qgroup>summary::after{content:'';width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .2s;margin-right:4px;flex:none}
.qgroup[open]>summary::after{transform:rotate(-135deg)}
.qlist{display:grid;border-top:1px solid var(--line)}
.qitem{padding:14px 16px}
.qitem+.qitem{border-top:1px dashed var(--line)}
.qcta{display:flex;align-items:center;gap:12px;width:100%;margin:16px 0 6px;padding:14px 16px;border:0;border-radius:16px;background:var(--olive);color:var(--on-olive);font:inherit;text-align:left;cursor:pointer;animation:qpulse 2.2s ease-in-out infinite}
.qcta .ic{display:grid;place-items:center;flex:none;width:38px;height:38px;border-radius:50%;background:var(--on-olive);color:var(--olive);font-weight:800;font-size:20px}
.qcta b{display:block;font-size:17px}
.qcta .small{display:block;opacity:.85;margin-top:2px}
.qcta .go{margin-left:auto;font-size:26px;line-height:1;opacity:.8}
@keyframes qpulse{0%,100%{transform:scale(1);box-shadow:0 0 0 0 color-mix(in srgb,var(--olive) 45%,transparent)}50%{transform:scale(1.015);box-shadow:0 0 0 9px color-mix(in srgb,var(--olive) 0%,transparent)}}
@media (prefers-reduced-motion:reduce){.qcta{animation:none}}
.quizzes{display:grid;gap:10px;margin:4px 0 18px}
.qcard{display:grid;gap:8px;padding:14px 16px}
.qcard .qtop{display:flex;align-items:center;justify-content:space-between;gap:10px}
.qcard h3{font-size:17px}
.qcard .qtop .btn{white-space:nowrap;flex:none}
.qcard .lead{display:grid;gap:3px;font-size:14px}
.qcard .lead div{display:flex;justify-content:space-between;gap:8px}
.qcard .lead .me{font-weight:700;color:var(--olive)}
.qz{position:fixed;inset:0;z-index:70;background:var(--paper);overflow:auto;padding:16px 16px calc(24px + env(safe-area-inset-bottom))}
.qz .in{max-width:560px;margin:0 auto;display:grid;gap:14px}
.qz .bar{display:flex;align-items:center;justify-content:space-between;gap:10px}
.qz .prog{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.qz .prog i{display:block;height:100%;background:var(--olive);transition:width .25s}
.qz .x{border:0;background:none;font:inherit;font-size:15px;color:var(--muted);cursor:pointer;padding:6px}
.qz h2{font-size:22px;line-height:1.25}
.qz .quote{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;font-style:italic;color:var(--ink)}
.qz .who{display:grid;justify-items:center;gap:6px}
.qz .opts{display:grid;gap:8px}
.qz .opt{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:12px 14px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);font:inherit;font-size:16px;cursor:pointer}
.qz .opt.ok{border-color:var(--olive);background:color-mix(in srgb,var(--olive) 14%,var(--surface))}
.qz .opt.bad{border-color:var(--warn);background:var(--warn-bg)}
.qz .opt[disabled]{cursor:default}
.qz .expl{font-size:15px;color:var(--muted)}
.qz .expl b{color:var(--ink)}
.qz .score{font-size:56px;font-weight:800;color:var(--olive);text-align:center;line-height:1}
.qz .center{text-align:center}

/* общие */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.sig{display:inline-block;width:1em;height:1em;flex:none;color:var(--olive);--sig-gap:var(--surface);vertical-align:-.16em}
.sig svg{display:block;width:100%;height:100%}
.fact .crest{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;font-size:17px;line-height:1.25;margin-top:4px}
.fact .crest>span:last-child{min-width:0}
.fact .crest .sig{font-size:56px}
.char h3 .sig{font-size:28px;margin-left:8px;vertical-align:-.3em}
.lb .sg{display:inline-flex;align-items:center;gap:8px;color:var(--sage);font-size:15px}
.lb .sig{font-size:40px;color:var(--sage);--sig-gap:#12160a}
.chip{display:inline-flex;align-items:center;flex-wrap:wrap;gap:4px;padding:3px 10px;border-radius:999px;background:var(--paper);border:1px solid var(--line);font-size:14px;max-width:100%}
.chip.me{background:var(--olive);border-color:var(--olive);color:var(--on-olive);font-weight:600}
.chip .n{color:var(--muted);font-size:13px}
.chip.me .n{color:inherit;opacity:.8}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.btn{cursor:pointer;border:1px solid var(--olive);background:var(--olive);color:var(--on-olive);border-radius:999px;padding:9px 16px;font-weight:600;font-size:15px}
.btn.ghost{background:transparent;color:var(--olive)}
.btn.sm{padding:5px 12px;font-size:14px}
.btn:disabled{opacity:.5;cursor:default}
.rl{border:0;background:none;padding:0;font:inherit;color:var(--olive);font-weight:600;cursor:pointer;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:2px}
.char.flash{box-shadow:inset 0 0 0 2px var(--olive-2)}
.link{cursor:pointer;background:none;border:0;padding:0;color:var(--olive);text-decoration:underline;text-underline-offset:3px;font-size:14px}
input[type=search],input[type=password]{width:100%;padding:11px 16px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
.note{padding:10px 14px;border-radius:var(--r);background:var(--warn-bg);color:var(--warn);font-size:14px}
.news{background:var(--olive);color:var(--on-olive);border-radius:var(--r);padding:14px 16px;display:grid;gap:4px}
.news b{font-size:16px} .news p{font-size:15px;opacity:.92}
details.news.story > summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
details.news.story > summary::-webkit-details-marker{display:none}
details.news.story[open] > summary .small{display:none}
details.news.story p{margin-top:8px;font-size:15px;line-height:1.55}
.news .rl{color:inherit}
.pn{cursor:pointer;text-decoration:underline dotted;text-decoration-thickness:1px;text-underline-offset:3px}
.chip.pc{cursor:pointer}
.rl.plain{color:inherit;font-weight:inherit;text-decoration:none;text-align:left}
.news.soft{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:calc(var(--tabbar) + 14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:999px;font-size:14px;z-index:20;max-width:calc(100% - 32px);text-align:center}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.seg button{flex:1;border:0;background:transparent;border-radius:999px;padding:7px 10px;font-weight:600;font-size:14px;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--olive);color:var(--on-olive)}
.dayhead{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;margin-top:6px}
.dayhead i{width:12px;height:12px;border-radius:3px;display:inline-block;box-shadow:inset 0 0 0 1px var(--line)}
.dayhead span{color:var(--muted);font-weight:500;letter-spacing:.04em}

/* «Я» */
.pick{display:flex;flex-wrap:wrap;gap:8px}
.pick button{cursor:pointer;display:flex;align-items:center;gap:8px;padding:6px 14px 6px 8px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
.pick button:disabled{opacity:.45;cursor:default}
.hero{display:flex;gap:16px;align-items:center}
.hero h2{font-size:30px;font-weight:800}
.hero .role{color:var(--olive-2);font-weight:600;font-size:18px;margin-top:2px}
.about{font-size:15px;color:var(--muted)}
.about::first-letter{text-transform:uppercase}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:2px;align-content:start;min-width:0}
.fact.wide{grid-column:1/-1}
.fact .k{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.fact .v{font-size:18px;font-weight:700}
.fact .s{font-size:14px;color:var(--muted)}
.fact a{color:inherit}
.task{padding:12px 14px;display:grid;gap:6px}
.task .hd{display:flex;justify-content:space-between;align-items:center;gap:10px}
.task .tm{font-weight:700;font-size:14px;font-variant-numeric:tabular-nums;background:var(--olive);color:var(--on-olive);border-radius:999px;padding:1px 10px}
.task h4{font-size:17px;font-weight:800}
.task .tk{font-size:13.5px;color:var(--muted);margin-top:-4px}
.task .mn{font-size:14px;color:var(--ink)}
details.day-tasks{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
details.day-tasks > summary{cursor:pointer;list-style:none;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
details.day-tasks > summary::-webkit-details-marker{display:none}
details.day-tasks > summary::after{content:"";width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);flex:none;margin-left:auto}
details.day-tasks[open] > summary::after{transform:rotate(-135deg)}
details.day-tasks > summary .small{margin-left:auto}
.day-body{padding:0 12px 12px;display:grid;gap:10px}
details.team{background:var(--surface);border:1px solid var(--line);border-radius:12px}
details.team > summary{cursor:pointer;list-style:none;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px}
details.team > summary::-webkit-details-marker{display:none}
details.team > summary b{font-size:15px}
details.team > summary .small{white-space:nowrap}
details.team > summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);flex:none;margin-left:4px}
details.team[open] > summary::after{transform:rotate(-135deg)}
.team-body{padding:0 14px 12px;display:grid;gap:10px}
.team-body .row{display:grid;gap:4px;padding-top:10px;border-top:1px dashed var(--line)}
.team-body .row .t{font-size:13.5px;color:var(--muted)}
details.more summary{cursor:pointer;color:var(--olive);font-size:14px;font-weight:600;list-style:none;display:inline-flex;align-items:center;gap:6px}
details.more summary::-webkit-details-marker{display:none}
details.more summary::after{content:"";width:6px;height:6px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg) translateY(-2px)}
details.more[open] summary::after{transform:rotate(-135deg)}
details.more p{margin-top:6px;font-size:14.5px;background:var(--paper);border-radius:10px;padding:10px 12px;white-space:pre-line}

/* расписание */

    var m = t.match(/^все(?:\s*,?\s*кроме\s*(.*))?$/);
    if (m) {
      var except = m[1] ? parsePeople(String(str).replace(/^[^к]*кроме\s*/i, '')).map(function (p) { return p.name; }) : [];
      return { label: String(str).trim(), people: adults.filter(function (g) { return except.indexOf(g.name) < 0; }).map(function (g) { return { name: g.name, note: '' }; }) };
    }
    return null;
  }
  var duties = (raw.duties || []).filter(shown_).map(function (d) {
    var grp = group_(d.people);
    return { row: d._row, block: d.block, guild: guildOf(d.block).name, task: d.task, day: d.day, time: d.time || '', note: d.note || '', details: d.details || '',
      label: grp ? grp.label : '', people: grp ? grp.people : parsePeople(d.people).filter(vis),
      declined: parsePeople(d.declined).map(function (p) { return p.name; }) };
  }).sort(function (a, b) { return DAYS.indexOf(a.day) - DAYS.indexOf(b.day) || timeKey_(a.time) - timeKey_(b.time); });

  // Мои задачи по времени + мои команды (гильдии) по дням
  var myTasks = [], myTeams = [];
  if (me) {
    duties.forEach(function (d) {
      var mine = d.people.filter(function (p) { return p.name === me; })[0];
      if (mine) myTasks.push({ row: d.row, day: d.day, time: d.time, task: d.task, note: d.note, details: d.details, label: d.label, myNote: mine.note, block: d.block, guild: d.guild,
        with: d.people.filter(function (p) { return p.name !== me; }), crowd: d.people.length });
    });
    DAYS.forEach(function (day) {
      var blocks = [];
      myTasks.forEach(function (t) { if (t.day === day && blocks.indexOf(t.block) < 0) blocks.push(t.block); });
      blocks.forEach(function (b) {
        var g = guildOf(b);
        myTeams.push({ day: day, block: b, guild: g.name, lead: g.lead, about: g.about,
          tasks: duties.filter(function (d) { return d.day === day && d.block === b; }) });
      });
    });
  }

  var cars = (raw.cars || []).filter(shown_).filter(function (c) { return c.driver && !hidden[c.driver]; }).map(function (c) {
    return { row: c._row, driver: c.driver, when: c.when, from: String(c.from || '').trim(), seats: Number(c.seats) || 4, passengers: parsePeople(c.passengers).filter(vis).map(function (p) { return p.name; }),
      edit: '' };
  });
  var isDriver = !!me && cars.some(function (c) { return c.driver === me; });
  cars.forEach(function (c) { c.edit = acc.admin && !viewAs ? 'full' : (c.driver === me ? 'own' : (isDriver ? 'add' : '')); c.canEdit = !!c.edit; });
  var seated_ = {}; cars.forEach(function (c) { seated_[c.driver] = 1; c.passengers.forEach(function (p) { seated_[p] = 1; }); });
  var loose = adults.filter(function (g) { return !seated_[g.name]; }).map(function (g) { return g.name; });
  var allProps = (raw.props || []).filter(shown_).map(function (p) { return { item: p.item, who: parsePeople(p.who).filter(vis).map(function (x) { return x.name; }) }; });
  cars.forEach(function (c) {
    if (c.driver !== me) return;
    var crew = [c.driver].concat(c.passengers);
    c.load = allProps.filter(function (p) { return p.who.some(function (w) { return crew.indexOf(w) >= 0; }); });
  });

  var tabs = (raw.tabs && raw.tabs.length ? raw.tabs : [{ id: 'me', name: 'Я', show: true }, { id: 'plan', name: 'План', show: true }, { id: 'people', name: 'Жители', show: true }, { id: 'home', name: 'Дом', show: true }, { id: 'road', name: 'Дорога', show: true }])
    .filter(function (t) { return t.id && (t.show === '' || t.show == null || isTrue_(t.show)); })
    .map(function (t) { return { id: String(t.id).trim(), name: t.name || t.id }; });

  var out = {
    title: s['Название'] || '', subtitle: s['Подзаголовок'] || '', dates: dates,
    access: acc, me: me, tabs: tabs,
    guests: visGuests.map(function (g) {
      var o = { name: g.name, character: g.character || '', about: g.about || '', costume: g.costume || '', pickup: g.pickup || '', avatar: g.avatar || '', shared: !!shared[g.name], tg: String(g.tg || '').trim().replace(/^https?:\/\/t\.me\//i, '').replace(/^@/, '') };
      if (acc.admin) o.status = g.status;
      if (opts.tg) o.linked = !!(g.tgId || g.tg);
      return o;
    }),
    schedule: (raw.schedule || []).filter(shown_).map(function (e) { return { day: e.day, start: e.start || '', end: e.end || '', title: e.title, note: e.note || '' }; }),
    cars: cars,
    myProps: me ? allProps.filter(function (p) { return p.who.indexOf(me) >= 0; }) : [],
    rooms: (raw.rooms || []).map(function (r) { return { id: r.id, floor: Number(r.floor), name: r.name, beds: r.beds || '', people: parsePeople(r.people).filter(vis).map(function (x) { return x.name; }) }; }),
    seats: (raw.seats || []).map(function (x) { return { seat: Number(x.seat), name: x.name && !hidden[x.name] ? x.name : '' }; }),
    contacts: (raw.contacts || []).filter(shown_).filter(function (c) { return c.name && !hidden[c.name]; }).map(function (c) {
      return { name: c.name, role: c.role || '', tg: String(c.tg || c.link || '').trim().replace(/^@/, '').replace(/^https?:\/\/t\.me\//, ''), phone: String(c.phone || '').trim(), top: isTrue_(c.top) };
    }),
    news: (raw.news || []).filter(shown_).filter(function (n) { return n.title || n.text; }).map(function (n) { return { title: n.title || '', text: n.text || '', where: n.where || 'все', top: isTrue_(n.top) }; }),
    myTasks: myTasks, myTeams: myTeams, loose: loose,
    arrivals: (function () { var m = {}; visGuests.forEach(function (g) { if (g.arrival) m[g.name] = String(g.arrival); }); return m; })(),
    tg: opts.tg ? { linked: !!tgG } : null,
    viewAs: viewAs
  };
  var slots = hostSlots_(raw);
  out.hosts = [];
  for (var hn = 1; hn <= HOSTS_N; hn++) out.hosts.push({ slot: hn, nick: slots[hn] ? String(slots[hn].nick || '') : '', taken: !!slots[hn] });
  out.host = hostRow ? { slot: Number(hostRow.slot), nick: String(hostRow.nick || '') } : null;
  if (hostRow) {
    // заметки ведущих: у каждого свои, чужие видны для сведения
    out.hostNotes = {};
    (raw.hostNotes || []).forEach(function (r) {
      var sl = Number(r.slot); if (!slots[sl] || !known[r.name] || (!r.text && !r.mark)) return;
      (out.hostNotes[r.name] = out.hostNotes[r.name] || []).push({ slot: sl, nick: String(slots[sl].nick || ''), text: String(r.text || ''), mark: String(r.mark || ''), mine: sl === Number(hostRow.slot) });
    });
  }
  // Викторины: лучший результат каждого гостя, по убыванию баллов (при равенстве раньше выше)
  out.quiz = {}; out.quizMine = {}; out.quizReal = {}; out.quizPerfect = {};
  ['roles', 'history', 'makar'].forEach(function (k) {
    var best = {};
    (raw.quiz || []).forEach(function (r) {
      if (r.quiz !== k || !known[r.name] || shared[r.name]) return;
      var sc = Number(r.score) || 0, tot = Number(r.total) || 10, b = best[r.name];
      if (!b || sc > b.score) best[r.name] = { name: r.name, score: sc, total: tot, at: String(r.at || '') };
    });
    out.quizPerfect[k] = !!realMe && (raw.quiz || []).some(function (r) { return r.quiz === k && r.name === realMe && Number(r.score) >= Number(r.total || 10); });
    out.quizReal[k] = realMe ? (raw.quiz || []).filter(function (r) { return r.quiz === k && r.name === realMe; }).length : 0;
    out.quizMine[k] = me ? (raw.quiz || []).filter(function (r) { return r.quiz === k && r.name === me; }).length : 0;
    out.quiz[k] = Object.keys(best).map(function (n) { return best[n]; })
      .sort(function (a, b) { return b.score - a.score || (a.at < b.at ? -1 : a.at > b.at ? 1 : 0); });
  });
  // Общий зачёт: лучший результат в каждой игре, приведённый к 10 баллам, складывается
  var GAMES = ['roles', 'history', 'makar'], tally = {};
  GAMES.forEach(function (k) { (out.quiz[k] || []).forEach(function (x) {
    var t = tally[x.name] || (tally[x.name] = { name: x.name, pts: 0, parts: {}, at: '' });
    // игра: 60 очков = 10 баллов (шкала одна для всех результатов, даже записанных раньше)
    var p = k === 'makar' ? Math.round(Math.min(x.score, 60) / 60 * 100) / 10 : Math.round(x.score / (x.total || 10) * 100) / 10;
    t.parts[k] = p; t.pts = Math.round((t.pts + p) * 10) / 10; if (x.at > t.at) t.at = x.at;
  }); });
  out.quizGames = GAMES;
  out.quizTotal = Object.keys(tally).map(function (n) { return tally[n]; })
    .sort(function (a, b) { return b.pts - a.pts || (a.at < b.at ? -1 : a.at > b.at ? 1 : 0); });
  { out.address = s['Адрес'] || ''; out.mapUrl = s['Ссылка на карту'] || ''; out.addressNote = s['Подпись к адресу'] || ''; }
  if (acc.admin) {
    out.duties = duties;
    out.props = allProps;
    out.borrowed = visGuests.filter(function (g) { return g.costume || g.pickup; }).map(function (g) { return { name: g.name, what: g.costume || '', pickup: g.pickup || '' }; });
    out.guilds = guilds;
    out.hostsAdmin = out.hosts.map(function (h) { var r = slots[h.slot]; return { slot: h.slot, nick: h.nick, taken: h.taken, tg: r ? String(r.tg || '') : '', linked: !!(r && r.tgId) }; });
    out.hidden = raw.guests.filter(function (g) { return hidden[g.name]; }).map(function (g) { return { name: g.name, character: g.character || '' }; });
    var inCar = {}; cars.forEach(function (c) { inCar[c.driver] = 1; c.passengers.forEach(function (p) { inCar[p] = 1; }); });
    var seated = {}; out.seats.forEach(function (x) { if (x.name) seated[x.name] = 1; });
    var housed = {}; out.rooms.forEach(function (r) { r.people.forEach(function (p) { housed[p] = 1; }); });
    out.gaps = {
      noCar: adults.filter(function (g) { return !inCar[g.name]; }).map(function (g) { return g.name; }),
      noSeat: adults.filter(function (g) { return !seated[g.name]; }).map(function (g) { return g.name; }),
      noRoom: adults.filter(function (g) { return !housed[g.name]; }).map(function (g) { return g.name; }),
      emptyTasks: duties.filter(function (d) { return !d.people.length; }).map(function (d) { return d.day + ' · ' + d.task + (d.note ? ': ' + d.note : ''); })
    };
    // «?» у участника: ждём ответа; «Отказались»: кто нажал «Не смогу»
    out.answers = { pending: [], declined: [] };
    duties.forEach(function (d) {
      var what = { day: d.day, time: d.time, task: d.task };
      d.people.forEach(function (p) { if (/\?\s*$/.test(p.note)) out.answers.pending.push({ name: p.name, day: what.day, time: what.time, task: what.task }); });
      d.declined.forEach(function (n) { out.answers.declined.push({ name: n, day: what.day, time: what.time, task: what.task }); });
    });
  }
  return out;
}

// Меняет raw и возвращает список изменений ячеек [{sheet, row, field, value}] для записи в таблицу.
function applyAction(raw, a, code, tg) {
  var changes = [], tgG = tgGuest_(raw, tg);
  if (tg) a.me = tgG ? tgG.name : '';
  var acc = access_(raw, code, tgG ? tgG.name : '');
  var guest = raw.guests.filter(function (g) { return g.name === a.me; })[0];
  var hiddenMe = guest && /не\s*прид/.test(norm_(guest.status));
  function fail(msg) { throw new Error(msg); }

  if (a.type === 'setCar') {
    var car = raw.cars.filter(function (c) { return c._row === Number(a.row); })[0];
    if (!car) fail('Такой машины больше нет, обнови страницу.');
    var names = {}; raw.guests.forEach(function (g) { if (!/не\s*прид/.test(norm_(g.status))) names[g.name] = 1; });
    var liveCars = raw.cars.filter(shown_);
    var meDrives = !!guest && !hiddenMe && liveCars.some(function (c) { return c.driver === a.me; });
    var mode = acc.admin ? 'full' : (meDrives && car.driver === a.me ? 'own' : (meDrives ? 'add' : ''));
    if (!mode) fail('Менять состав машин могут только водители.');
    var want = (a.passengers || []).filter(function (n, i, arr) { return names[n] && n !== car.driver && arr.indexOf(n) === i; });
    if (want.length > (Number(car.seats) || 4)) fail('Мест в машине: ' + (Number(car.seats) || 4) + '.');
    var old = parsePeople(car.passengers);
    if (mode !== 'full') {
      var seatedNow = {};
      liveCars.forEach(function (c) { seatedNow[c.driver] = 1; parsePeople(c.passengers).forEach(function (p) { seatedNow[p.name] = 1; }); });
      var oldNames = old.map(function (p) { return p.name; });
      var added = want.filter(function (n) { return oldNames.indexOf(n) < 0; });
      var removed = oldNames.filter(function (n) { return names[n] && want.indexOf(n) < 0; });
      added.forEach(function (n) { if (seatedNow[n]) fail(n + ' уже едет в другой машине. Добавлять можно только тех, кто нигде не записан.'); });
      if (mode === 'add' && removed.length) fail('Убирать людей из чужой машины может только её водитель.');
      if (mode === 'add') a.when = '';
    }
    // скрытые гости, записанные в эту машину, остаются на своих местах
    var keepHidden = old.filter(function (p) { return !names[p.name]; });
    raw.cars.forEach(function (c) {
      if (c === car) return;
      var list = parsePeople(c.passengers), next = list.filter(function (p) { return want.indexOf(p.name) < 0; });
      if (next.length !== list.length) { c.passengers = joinPeople(next); changes.push({ sheet: 'cars', row: c._row, field: 'passengers', value: c.passengers }); }
    });
    car.passengers = joinPeople(keepHidden.concat(want.map(function (n) { var o = old.filter(function (p) { return p.name === n; })[0]; return o || { name: n, note: '' }; })));
    changes.push({ sheet: 'cars', row: car._row, field: 'passengers', value: car.passengers });
    if (typeof a.when === 'string' && a.when.trim() && a.when.trim() !== car.when) {
      car.when = a.when.trim().slice(0, 60);
      changes.push({ sheet: 'cars', row: car._row, field: 'when', value: car.when });
    }
  } else if (a.type === 'linkTg') {
    if (!tg) fail('Привязка работает только внутри Telegram.');
    if (tgG) fail('Твой Telegram уже привязан к гостю «' + tgG.name + '». Если это ошибка, напиши Ксении.');
    var lg = raw.guests.filter(function (x) { return x.name === a.name; })[0];
    if (!lg || /не\s*прид/.test(norm_(lg.status))) fail('Нет такого гостя.');
    if (isTrue_(lg.shared)) fail('Это общий аккаунт, его нельзя привязать к своему Telegram.');
    if (lg.tgId || lg.tg) fail('К «' + lg.name + '» уже привязан другой Telegram. Если это ты, напиши Ксении.');
    lg.tgId = String(tg.id); lg.tg = tg.username ? '@' + tg.username : '';
    changes.push({ sheet: 'guests', row: lg._row, field: 'tgId', value: lg.tgId });
    if (lg.tg) changes.push({ sheet: 'guests', row: lg._row, field: 'tg', value: lg.tg });
  } else if (a.type === 'answerTask') {
    if (!guest || hiddenMe) fail('Сначала выбери себя.');
    var duty = (raw.duties || []).filter(function (d) { return d._row === Number(a.row); })[0];
    if (!duty) fail('Такой задачи больше нет, обнови страницу.');
    var ppl = parsePeople(duty.people), mineP = ppl.filter(function (p) { return p.name === a.me; })[0];
    if (!mineP || !/\?\s*$/.test(mineP.note)) fail('На этот вопрос уже есть ответ.');
    if (a.answer === 'yes') {
      mineP.note = mineP.note.replace(/\s*\?+\s*$/, '');
    } else {
      ppl = ppl.filter(function (p) { return p !== mineP; });
      var dec = parsePeople(duty.declined);
      if (!dec.some(function (p) { return p.name === a.me; })) dec.push({ name: a.me, note: '' });
      duty.declined = joinPeople(dec);
      changes.push({ sheet: 'duties', row: duty._row, field: 'declined', value: duty.declined });
    }
    duty.people = joinPeople(ppl);
    changes.push({ sheet: 'duties', row: duty._row, field: 'people', value: duty.people });
  } else if (a.type === 'quizResult') {
    if (!guest || hiddenMe || isTrue_(guest.shared)) fail('Сначала выбери себя.');
    if (['roles', 'history', 'makar'].indexOf(a.quiz) < 0) fail('Нет такой викторины.');
    var isGame = a.quiz === 'makar';
    var tot = Math.round(Number(a.total)), sc = Math.round(Number(a.score));
    if (!(tot >= 1 && tot <= (isGame ? 60 : 20) && sc >= 0 && sc <= tot)) fail('Странный результат.');
    if (!isGame && (raw.quiz || []).filter(function (r) { return r.quiz === a.quiz && r.name === a.me; }).length >= 3) fail('Все три попытки уже использованы.');
    var rec = { name: a.me, quiz: a.quiz, score: sc, total: tot, at: new Date().toISOString() };
    (raw.quiz = raw.quiz || []).push(rec);
    changes.push({ sheet: 'quiz', append: true, values: rec });
  } else if (a.type === 'claimHost') {
    var hs = Number(a.slot), byS = hostSlots_(raw);
    if (!(hs >= 1 && hs <= HOSTS_N)) fail('Нет такого места ведущего.');
    if (byS[hs]) fail('Это место уже занято. Если оно твоё, введи кодовое слово.');
    var nick = String(a.nick || '').trim().slice(0, 30), hkey = String(a.hkey || '').trim();
    if (!nick) fail('Напиши свой ник.');
    if (hkey.length < 4) fail('Кодовое слово: хотя бы 4 символа.');
    if (tgG) fail('Этот Telegram уже привязан к гостю «' + tgG.name + '».');
    if (tg && hostOf_(raw, 0, '', tg)) fail('Этот Telegram уже привязан к другому ведущему.');
    var hrec = { slot: hs, nick: nick, key: hkey, tgId: tg ? String(tg.id) : '', tg: tg && tg.username ? '@' + tg.username : '', at: new Date().toISOString() };
    (raw.hosts = raw.hosts || []).push(hrec);
    changes.push({ sheet: 'hosts', append: true, values: hrec });
  } else if (a.type === 'hostNote') {
    var hh = tgG ? null : hostOf_(raw, a.host, a.hkey, tg);
    if (!hh) fail('Нужно войти как ведущий.');
    if (!raw.guests.some(function (x) { return x.name === a.name; })) fail('Нет такого игрока.');
    var nrow = (raw.hostNotes = raw.hostNotes || []).filter(function (r) { return Number(r.slot) === Number(hh.slot) && r.name === a.name; })[0];
    var ntext = a.text == null ? null : String(a.text).slice(0, 1000), nmark = a.mark == null ? null : String(a.mark).replace(/[^★✓]/g, '');
    var nat = new Date().toISOString();
    if (nrow) {
      if (ntext != null) { nrow.text = ntext; changes.push({ sheet: 'hostNotes', row: nrow._row, field: 'text', value: ntext }); }
      if (nmark != null) { nrow.mark = nmark; changes.push({ sheet: 'hostNotes', row: nrow._row, field: 'mark', value: nmark }); }
      changes.push({ sheet: 'hostNotes', row: nrow._row, field: 'at', value: nat });
    } else {
      var nrec = { slot: Number(hh.slot), nick: String(hh.nick || ''), name: a.name, text: ntext || '', mark: nmark || '', at: nat };
      raw.hostNotes.push(nrec);
      changes.push({ sheet: 'hostNotes', append: true, values: nrec });
    }
  } else if (a.type === 'setStatus') {
    if (!acc.admin) fail('Нужен код организатора.');
    var g = raw.guests.filter(function (x) { return x.name === a.name; })[0];
    if (!g) fail('Нет такого гостя.');
    g.status = a.status;
    changes.push({ sheet: 'guests', row: g._row, field: 'status', value: a.status });
  } else fail('Неизвестное действие.');
  return changes;
}

<script>
(function(){
var DN={'Пт':'Пятница','Сб':'Суббота','Вс':'Воскресенье'};
var DC={'Пт':'var(--d1)','Сб':'var(--d2)','Вс':'var(--d3)'};
var LS={get:function(k){try{return localStorage.getItem('chembalo.'+k)||''}catch(e){return ''}},
        set:function(k,v){try{v?localStorage.setItem('chembalo.'+k,v):localStorage.removeItem('chembalo.'+k)}catch(e){}}};
var TG=(window.Telegram&&Telegram.WebApp&&Telegram.WebApp.initData)?Telegram.WebApp:null;
if(TG){ try{ TG.ready(); TG.expand(); }catch(e){} }
function tgTheme(){ if(!TG) return; document.documentElement.setAttribute('data-theme',TG.colorScheme==='dark'?'dark':'light');
  var cs=getComputedStyle(document.documentElement); try{ TG.setHeaderColor(cs.getPropertyValue('--top-bg').trim()); TG.setBackgroundColor(cs.getPropertyValue('--paper').trim()); TG.setBottomBarColor&&TG.setBottomBarColor(cs.getPropertyValue('--surface').trim()); }catch(e){} }
if(TG){ tgTheme(); try{TG.onEvent('themeChanged',function(){tgTheme();render();})}catch(e){} }
function haptic(kind){ try{ TG&&TG.HapticFeedback.notificationOccurred(kind) }catch(e){} }

var S={gIdx:0,openNews:{},openDays:{},openEv:{},openSlot:{},viewAs:'',editCar:0,draft:[],draftWhen:'',data:null,me:TG?'':LS.get('me'),code:LS.get('code'),tab:(location.hash||'').slice(1)||LS.get('tab')||'me',
       selRoom:'',q:'',busy:false,syncing:false,showAdminLogin:false,homeSeg:'rooms',
       visitor:LS.get('visitor')==='1',host:LS.get('host'),hostKey:LS.get('hkey'),hostStep:'',hostDraft:{},hostQ:'',hostF:''};
var demoRaw=null;

    return new Promise(function(res,rej){
      try{
        if(action){ applyAction(demoRaw,Object.assign({me:S.me,code:S.code,host:S.host,hkey:S.hostKey},action),S.code); try{localStorage.setItem('chembalo.demoRaw2',JSON.stringify(demoRaw))}catch(e){} }
        res(buildPayload(demoRaw,{me:S.me,code:S.code,as:S.viewAs,host:S.host,hkey:S.hostKey}));
      }catch(e){rej(e)}
    });
  }
  var req = action
    ? fetch(CONFIG.api,{method:'POST',body:JSON.stringify(Object.assign({me:S.me,code:S.code,host:S.host,hkey:S.hostKey,tg:TG?TG.initData:''},action))})
    : fetch(CONFIG.api+'?me='+encodeURIComponent(S.me)+'&code='+encodeURIComponent(S.code)+(S.viewAs?'&as='+encodeURIComponent(S.viewAs):'')+(S.host?'&host='+encodeURIComponent(S.host)+'&hkey='+encodeURIComponent(S.hostKey):'')+(TG?'&tg='+encodeURIComponent(TG.initData):''));
  return req.then(function(r){return r.json()}).then(function(j){ if(!j.ok) throw new Error(j.error); return j.data; });
}
function cacheKey(){ return 'cache.'+(TG&&TG.initDataUnsafe&&TG.initDataUnsafe.user?TG.initDataUnsafe.user.id:(S.host?'host'+S.host:(S.me||'anon'))); }
function accept(d){ S.data=d; if(d.viewAs) return;
  if(S.host&&!d.host){ S.host=''; S.hostKey=''; LS.set('host',''); LS.set('hkey',''); }
  if(d.tg) S.me=d.me; else if(S.me && d.me!==S.me){S.me='';LS.set('me','')}
  if(!demoRaw){ try{ localStorage.setItem('chembalo.'+cacheKey(), JSON.stringify(d)) }catch(e){} } }

function load(){

  var my=S.reqId=(S.reqId||0)+1;

  return api().then(function(d){ if(my!==S.reqId) return; S.syncing=false; S.switching=''; accept(d); render(); })
    .catch(function(e){ if(my!==S.reqId) return; S.syncing=false; if(S.switching){ S.switching=''; S.viewAs=S.prevViewAs||''; }
      if(!S.data){$app.innerHTML='<div class="loading">Не получилось загрузить данные.<br><span class="small muted">'+esc(e.message)+'</span><br><br><button class="btn" data-act="reload">Попробовать ещё раз</button></div>'}

  if(S.busy) return;

    .then(function(){S.busy=false; render();});

function dt(day,hm){var d=S.data.dates[day]; if(!d||!hm) return null; var p=d.split('.'), t=hm.split(':'); return new Date(+p[2],+p[1]-1,+p[0],+t[0],+t[1]);}
function events(){
  return S.data.schedule.map(function(e){
    var a=dt(e.day,e.start), b=dt(e.day,e.end);
    if(!a&&b) a=new Date(b.getTime()-30*60000);
    if(a&&!b) b=new Date(a.getTime()+3*3600000);
    if(a&&b&&b<=a) b=new Date(b.getTime()+86400000);
    return Object.assign({},e,{a:a,b:b});
  }).filter(function(e){return e.a});
}
function plural(n,f){var m=n%10,h=n%100; return n+' '+(m==1&&h!=11?f[0]:(m>=2&&m<=4&&(h<10||h>=20)?f[1]:f[2]));}
function nowLine(){
  var ev=events(), now=new Date(); if(!ev.length) return '';
  var first=ev.reduce(function(m,e){return e.a<m?e.a:m},ev[0].a), last=ev.reduce(function(m,e){return e.b>m?e.b:m},ev[0].b);
  if(now<first){ var ms=first-now, d=Math.floor(ms/86400000), h=Math.floor(ms%86400000/3600000);
    return 'до заезда<b>'+(d?plural(d,['день','дня','дней']):plural(h,['час','часа','часов']))+'</b>'; }
  if(now>last) return '<b>Спасибо, что были!</b>';
  var cur=ev.filter(function(e){return e.a<=now&&now<e.b}).map(function(e){return e.title});
  var nx=ev.filter(function(e){return e.a>now}).sort(function(x,y){return x.a-y.a})[0];
  return 'сейчас<b>'+esc(cur.join(' · ')||'свободное время')+'</b>'+(nx?'дальше: '+esc(nx.title)+' в '+esc(nx.start):'');
}
function isToday(day){ var d=S.data.dates[day]; if(!d) return false; var p=d.split('.'), n=new Date(); return +p[0]===n.getDate()&&+p[1]===n.getMonth()+1&&+p[2]===n.getFullYear(); }
function isNow(e){var x=events().filter(function(v){return v.day===e.day&&v.start===e.start&&v.title===e.title})[0]; var n=new Date(); return x&&x.a<=n&&n<x.b;}

  var free=!S.me||!!(S.data&&S.data.viewAs);
  if(!free&&quizLeft(kind)<=0){ toast('Попытки закончились'); return; }
  if(free&&quizGated(kind)){ toast('Сначала используй свои попытки'); return; }
  Q={kind:kind,qs:qs,i:0,score:0,picked:-1,done:false,free:free};
  if(!free) try{localStorage.setItem('chembalo.qzrun',JSON.stringify({me:S.me,kind:kind,score:0,total:qs.length}))}catch(e){}
  var el=document.getElementById('qz'); if(!el){el=document.createElement('div');el.id='qz';el.className='qz';el.setAttribute('role','dialog');document.body.appendChild(el);}
  document.body.style.overflow='hidden'; quizRender();
}
var QMAX=3;
function quizLeft(kind){ var m=(S.data.quizMine||{})[kind]||0; return Math.max(0,QMAX-m); }
// под чужим аккаунтом (Макар) викторину можно проходить без счёта, но только когда свои попытки уже кончились
function realLeft(kind){ var m=(S.data.quizReal||{})[kind]||0; return Math.max(0,QMAX-m); }
function viewingShared(){ var d=S.data; return !!(d&&d.viewAs&&guest(d.viewAs).shared); }
function quizGated(kind){ return viewingShared()&&realLeft(kind)>0&&!(S.data.quizPerfect||{})[kind]; }
function sharedName(){ var g=(S.data.guests||[]).filter(function(x){return x.shared})[0]; return g?g.name:''; }
function quizSave(){ if(!Q||Q.saved) return; Q.saved=true; try{localStorage.removeItem('chembalo.qzrun')}catch(e){}
  if(S.me&&!(S.data&&S.data.viewAs)) Q.savePromise=api({type:'quizResult',quiz:Q.kind,score:Q.score,total:Q.qs.length}).then(function(d){accept(d); render();}).catch(function(e){toast(e.message)}); }
function askConfirm(msg,cb){ if(TG&&TG.showConfirm){ try{ TG.showConfirm(msg,function(ok){ if(ok) cb(); }); return; }catch(e){} } if(window.confirm(msg)) cb(); }
function quizClose(force){
  if(Q&&!Q.done&&!force&&!Q.free){ askConfirm('Если выйти сейчас, попытка засчитается с текущим счётом ('+Q.score+'). Выйти?',function(){ quizSave(); quizClose(true); }); return; }
  var el=document.getElementById('qz'); if(el) el.remove(); document.body.style.overflow=''; Q=null; render();}
// незаконченная попытка (приложение закрыли посреди викторины) засчитывается при следующем входе
function quizRecover(){ var r=null; try{ r=JSON.parse(localStorage.getItem('chembalo.qzrun')||'null'); }catch(e){} if(!r||!S.me||r.me!==S.me) return;
  try{localStorage.removeItem('chembalo.qzrun')}catch(e){}
  api({type:'quizResult',quiz:r.kind,score:r.score,total:r.total}).then(function(d){accept(d); render(); toast('Незаконченная попытка засчитана: '+r.score+' из '+r.total);}).catch(function(){}); }
function quizRender(){

  if(Q.done){
    var n=Q.qs.length, s=Q.score, phrase=s===n?'Безупречно! Ты знаешь крепость как свои пять пальцев.':s>=n*0.7?'Отлично! Консул тобой доволен.':s>=n*0.4?'Неплохо, но стражник у ворот знает больше.':'Похоже, ты только что прибыл в город. Попробуй ещё раз!';

      (Q.free||quizLeft(Q.kind)-1>0?'<button class="btn" data-act="qzstart" data-kind="'+Q.kind+'">Пройти ещё раз'+(Q.free?'':quizLeft(Q.kind)-1===1?' (последняя попытка)':' (осталось '+(quizLeft(Q.kind)-1)+')')+'</button>':'<p class="center small">Все попытки использованы.</p>')+
      (!Q.free&&sharedName()&&(s===n||quizLeft(Q.kind)-1<=0)?'<div class="note" style="display:grid;gap:8px">'+(s===n?'Идеально! ':'')+'Хочется пройти ещё? Загляни в аккаунт '+esc(sharedName())+'а: там викторину можно проходить сколько угодно, только не в зачёт.<button class="btn sm" style="justify-self:start" data-act="qzmakar">Зайти под '+esc(sharedName())+'ом</button></div>':'')+

    (ans?'<p class="expl">'+(q.opts[Q.picked].ok?'<b>Верно!</b> ':'<b>Мимо.</b> ')+q.e+'</p><button class="btn" data-act="qznext">'+(Q.i+1<Q.qs.length?'Дальше':'Узнать результат')+'</button>':'')+
    '</div>';
}
function quizPick(k){ if(!Q||Q.picked>=0) return; Q.picked=k; if(Q.qs[Q.i].opts[k].ok){Q.score++; haptic('success');} else haptic('error');

function quizNext(){
  if(!Q) return; Q.i++; Q.picked=-1;

  quizRender(); var el=document.getElementById('qz'); if(el) el.scrollTop=0;
}

// Упоминания ролей в тексте → «Роль (Имя)» со ссылкой на карточку
var _roleRx=null, _roleKey='';
function roleRx(){
  var gs=(S.data.guests||[]).filter(function(g){return g.character});
  var key=gs.map(function(g){return g.character+'|'+g.name}).join(';');
  if(key===_roleKey&&_roleRx) return _roleRx;
  var parts=gs.map(function(g){
    var words=g.character.split(/\s+/).map(function(w){ var st=w.length>3?w.replace(/[аяеоуыийь]$/i,''):w; return st.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'[а-яё]*'; });
    return {g:g, src:words.join('\\s+')};
  }).sort(function(a,b){return b.src.length-a.src.length});
  _roleKey=key; _roleRx={list:parts, rx:new RegExp('('+parts.map(function(p){return p.src}).join('|')+')','g')};
  return _roleRx;
}
// имена гостей в тексте (в любом падеже) превращаются в ссылки на карточку человека
var _nameKey='', _nameRx=null;
function nameForms_(n){
  var st, f;
  if(/ия$/.test(n)){ st=n.slice(0,-2); f=['ия','ии','ию','ией']; }
  else if(/[жшчщкгх]а$/.test(n)){ st=n.slice(0,-1); f=['а','и','е','у','ой']; }
  else if(/а$/.test(n)){ st=n.slice(0,-1); f=['а','ы','е','у','ой']; }
  else if(/я$/.test(n)){ st=n.slice(0,-1); f=['я','и','е','ю','ей']; }
  else if(/й$/.test(n)){ st=n.slice(0,-1); f=['й','я','ю','ем','е']; }
  else if(/[бвгдзклмнпрстфхжшчщц]$/.test(n)){ st=n; f=['','а','у','ом','е']; }
  else return [n];
  return f.map(function(e){return st+e});
}
function linkNames(html){
  if(!S.data||!S.data.guests) return html;
  var names=S.data.guests.map(function(g){return g.name}).filter(Boolean), key=names.join('|');
  if(key!==_nameKey){
    var map={}, all=[];
    names.forEach(function(n){ nameForms_(n).forEach(function(f){ if(!map[f]){ map[f]=n; all.push(f); } if(/ё/.test(f)){ var e=f.replace(/ё/g,'е'); if(!map[e]){ map[e]=n; all.push(e); } } }); });
    all.sort(function(a,b){return b.length-a.length});
    _nameKey=key; _nameRx={map:map, rx:new RegExp('(^|[^А-Яа-яЁё])('+all.join('|')+')(?![А-Яа-яЁё])','g')};
  }
  var R=_nameRx;
  return html.replace(R.rx,function(m,pre,w){ return pre+pn(R.map[w],w); });
}
function linkRoles(text, selfName){
  var html=esc(text); if(!S.data||!S.data.guests) return html;
  var R=roleRx(); if(!R.list.length) return html;
  return html.replace(R.rx,function(m){
    var hit=R.list.filter(function(p){return new RegExp('^'+p.src+'$').test(m)})[0]; if(!hit) return m;
    var n=hit.g.name; if(n===selfName) return m;
    return '<button class="rl" data-act="lb" data-name="'+esc(n)+'">'+m+' ('+(n===S.me?'ты':esc(n))+')</button>';
  });
}

function myDetails(t){
  // строки «роль: текст» видит только тот, у кого эта роль; «остальные: текст» видят все, у кого нет ни одной роли из подсказок
  var notes=[norm_(t.myNote)].concat((t.with||[]).map(function(p){return norm_(p.note)})), mineN=norm_(t.myNote), RX=/^\s*([^:]{2,40}):\s*(.+)$/;
  var lines=String(t.details||'').split(/\n+/);
  var mineHas=lines.some(function(l){ var m=l.match(RX); if(!m) return false; var k=norm_(m[1]); return k!=='остальные'&&mineN.indexOf(k)>=0; });
  return lines.map(function(line){
    var m=line.match(RX); if(!m) return line;
    var k=norm_(m[1]);
    if(k==='остальные') return mineHas?null:m[2];
    if(!notes.some(function(n){return n.indexOf(k)>=0})) return line;
    return mineN.indexOf(k)>=0?m[2]:null;
  }).filter(function(x){return x!=null}).join('\n').trim();
}

function guildCards(d){
  var order=[], by={};
  d.myTeams.forEach(function(tm){
    if(!by[tm.block]){ by[tm.block]={block:tm.block,guild:tm.guild,lead:tm.lead,about:tm.about,rows:[]}; order.push(tm.block); }
    tm.tasks.forEach(function(k){ by[tm.block].rows.push(k); });
  });
  var ord=function(b){ var k=BLOCK_ORDER.indexOf(b); return k<0?99:k; };
  order.sort(function(a,c){ return ord(a)-ord(c); });
  return order.map(function(b){
    var G=by[b], days=[];
    G.rows.forEach(function(k){ if(days.indexOf(k.day)<0) days.push(k.day); });
    days.sort(function(a,c){return DAYS.indexOf(a)-DAYS.indexOf(c)});
    var def=days.filter(function(x){return isToday(x)})[0]||'';
    var day=S.gDay&&(b in S.gDay)?S.gDay[b]:def; if(day&&days.indexOf(day)<0) day='';
    var noDays=NODAY_BLOCKS.indexOf(b)>=0; if(noDays) day='';
    var rows=G.rows.filter(function(k){return !day||k.day===day});
    rows=rows.filter(function(k){return !privateRow_(b,k)||k.people.some(function(p){return p.name===S.me})});
    var tasks=[], tby={};
    rows.forEach(function(k){
      var T=tby[k.task]; if(!T){ T=tby[k.task]={name:k.task,days:[],times:{},people:[],pm:{},crowd:0,label:'',rows:[]}; tasks.push(T); }
      T.rows.push(k); if(T.days.indexOf(k.day)<0) T.days.push(k.day);
      var tt=rangeOf_(k); if(tt) T.times[k.day]=tt;
      if(k.label&&k.people.length>8){ T.label=k.label; return; }
      k.people.forEach(function(p){
        var P=T.pm[p.name]; if(!P){ P=T.pm[p.name]={name:p.name,days:[],roles:[],ask:false,row:0}; T.people.push(P); }
        if(P.days.indexOf(k.day)<0) P.days.push(k.day);
        var r=roleOf_(p.note); if(r&&!/^главн/i.test(r)&&P.roles.indexOf(r)<0) P.roles.push(r);
        if(/^главн/i.test(r)&&P.roles.indexOf(r)<0) P.roles.unshift(r);
        if(/\?\s*$/.test(p.note)&&p.name===S.me){ P.ask=true; P.row=k.row; }
      });
    });
    tasks.sort(function(x,y){ var mx=Math.min.apply(null,x.rows.map(function(k){return k.row||1e9})), my=Math.min.apply(null,y.rows.map(function(k){return k.row||1e9})); return mx-my; });
    tasks.forEach(function(T){ T.days.sort(function(a,c){return DAYS.indexOf(a)-DAYS.indexOf(c)}); T.crowd=T.people.length; var tms={}; T.rows.forEach(function(k){ tms[rangeOf_(k)]=1; }); T.split=Object.keys(tms).length>1&&T.crowd>8; });
    var mine=d.myTasks.filter(function(t){return t.block===b&&(!day||t.day===day)});
    return {block:b,guild:G.guild,lead:G.lead,about:G.about,tasks:tasks,mine:mine,days:noDays?[]:days,day:day,noDays:noDays};
  });
}
function guildCarousel(d){
  var cards=guildCards(d); if(!cards.length) return '';
  var cur=Math.min(S.gIdx||0,cards.length-1);
  var dots=cards.length>1?'<div class="gc-dots" role="tablist">'+cards.map(function(c,i){return '<button class="'+(i===cur?'on':'')+'" data-act="gcgo" data-i="'+i+'" aria-label="'+esc(c.guild)+'"><span>'+esc(c.guild)+'</span></button>'}).join('')+'</div>':'';
  return dots+'<div class="gcar" id="gcar">'+cards.map(function(c,i){
    var tasksHtml=c.tasks.filter(function(T){ return !(c.lead&&!T.label&&T.people.length&&T.people.every(function(P){return P.name===c.lead})); }).map(function(T){
      var tv=function(x){ return /\d/.test(x)?'<b>'+esc(x)+'</b>':'<i>'+esc(x)+'</i>'; };
      var tset={}; T.days.forEach(function(day){ tset[T.split?'':(T.times[day]||'')]=1; });
      var when=c.noDays&&!Object.keys(T.times).length ? '' : Object.keys(tset).length===1
        ? T.days.map(function(day){return day.toLowerCase()}).join(' · ')+(Object.keys(tset)[0]?' · '+tv(Object.keys(tset)[0]):'')
        : T.days.map(function(day){ return day.toLowerCase()+(T.times[day]?' '+tv(T.times[day]):''); }).join(' · ');
      var body;
      if(T.split){
        var my=c.mine.filter(function(t){return t.task===T.name})[0];
        body='<p class="gc-txt">У каждого своё время.'+(my&&rangeOf_(my)?' <b class="gc-me-t">Твоё — '+esc(rangeOf_(my))+'</b>':'')+'</p>';
      } else if(T.label) body='<p class="gc-txt">'+esc(T.label.charAt(0).toUpperCase()+T.label.slice(1))+'</p>';
      else body='<div class="gc-ppl">'+T.people.map(function(P){
        var me=P.name===S.me, extra=P.days.length<T.days.length?daysTxt_(P.days):'';
        var sub=P.roles.concat(extra?[extra]:[]).join(' · ');
        return '<div class="gc-p'+(me?' me':'')+'"'+(P.ask?' role="button" tabindex="0" data-act="ask" data-row="'+P.row+'" aria-label="Подтвердить участие"':' role="button" tabindex="0" data-act="lb" data-name="'+esc(P.name)+'"')+'>'+
          '<span class="gc-av">'+avatar(P.name,'sm')+(P.ask?'<i class="gc-q" aria-hidden="true">?</i>':'')+'</span>'+
          '<span class="gc-n"><b>'+(me?'Ты':esc(P.name))+'</b>'+(sub?'<small>'+esc(sub)+'</small>':'')+(P.ask?'<small class="gc-ask">нажми, чтобы подтвердить</small>':'')+'</span></div>';
      }).join('')+'</div>';
      return '<section class="gc-t"><header><b>'+esc(T.name)+'</b><span>'+when+'</span></header>'+body+'</section>';
    }).join('');
    var og=[], ok={};
    c.mine.forEach(function(t){ var det=myDetails(t); if(!det) return; var key=t.task+'|'+det;
      if(!ok[key]){ ok[key]={task:t.task,det:det,days:[]}; og.push(ok[key]); }
      if(!c.noDays||rangeOf_(t)) ok[key].days.push(t.day+(rangeOf_(t)?' '+rangeOf_(t):'')); });
    var own=og.map(function(g){ return '<div class="gc-own"><span>'+(g.days.length?esc(g.days.join(', '))+' · ':'')+esc(g.days.length?g.task.charAt(0).toLowerCase()+g.task.slice(1):g.task)+'</span><p>'+linkNames(esc(g.det))+'</p></div>'; }).join('');
    return '<article class="gc" data-i="'+i+'"><div class="gc-in">'+
      '<header class="gc-h"><h3>'+esc(c.guild)+'</h3><div class="gc-orn" aria-hidden="true"><i></i><svg viewBox="0 0 44 50"><path d="M3 3H41V21C41 35 31 43.5 22 47.5C13 43.5 3 35 3 21Z"/></svg><i></i></div>'+
      (c.lead?'<div class="gc-lead'+(c.lead===S.me?' me':'')+'" role="button" tabindex="0" data-act="lb" data-name="'+esc(c.lead)+'">'+avatar(c.lead)+'<span><b>'+(c.lead===S.me?'Ты':esc(c.lead))+'</b><small>во главе гильдии</small></span></div>':c.about?'<p>'+esc(c.about)+'</p>':'')+'</header>'+
      (c.days.length>1?'<div class="gc-days" role="tablist">'+[''].concat(c.days).map(function(x){return '<button class="'+(x===c.day?'on':'')+'" data-act="gcday" data-b="'+esc(c.block)+'" data-day="'+x+'" aria-pressed="'+(x===c.day)+'">'+(x?esc(x):'Все дни')+'</button>'}).join('')+'</div>':'')+
      tasksHtml+(own?'<details class="more gc-more"><summary>Что именно делать</summary>'+own+'</details>':'')+
    '</div></article>';
  }).join('')+'</div>';
}
function gcarSync(){
  var el=document.getElementById('gcar'); if(!el) return;
  if(S.gIdx){ var c=el.children[S.gIdx]; if(c) el.scrollLeft=S.gIdx*(c.offsetWidth+10); }
  el.onscroll=function(){ var st=(el.children[0]?el.children[0].offsetWidth:el.clientWidth)+10, i=Math.round(el.scrollLeft/st); if(i!==S.gIdx){ S.gIdx=i; document.querySelectorAll('.gc-dots button').forEach(function(b,j){b.classList.toggle('on',j===i)}); } };
}

/* слоты внутри события: комментарий вида «13:00 Церковь: Кирилл, Ксения, Саша», по строке на группу */
function slotsOf(note){
  var lines=String(note||'').split(/\n|\s\|\s/).map(function(s){return s.trim()}).filter(Boolean);
  if(lines.length<2) return null;
  var out=[];
  for(var i=0;i<lines.length;i++){
    var m=lines[i].match(/^(\d{1,2}:\d{2}(?:\s*[–-]\s*\d{1,2}:\d{2})?)\s+([^:]+?):\s*(.*)$/);
    if(!m) return null;
    out.push({time:m[1].replace(/\s*[–-]\s*/,'–'), name:m[2].trim(), people:m[3].split(',').map(function(s){return s.trim()}).filter(Boolean)});
  }
  return out;
}
function isGuest(n){ var k=norm_(n); return (S.data.guests||[]).some(function(g){return norm_(g.name)===k}); }
function guestName(n){ var k=norm_(n), g=(S.data.guests||[]).filter(function(x){return norm_(x.name)===k})[0]; return g?g.name:n; }
function mySlot(){
  if(!S.me) return null; var k=norm_(S.me), res=null;
  S.data.schedule.forEach(function(e){ var sl=slotsOf(e.note); if(!sl||res) return;
    sl.forEach(function(s){ if(!res&&s.people.some(function(p){return norm_(p)===k})) res={ev:e,slot:s}; }); });
  return res;
}

function fortune(me){
  var today=ftToday(), who=me;
  if(!who){ who=LS.get('vid'); if(!who){ who='v'+Math.random().toString(36).slice(2,8); LS.set('vid',who); } }
  var seed=who+'|'+today, phase=me?ftPhase(today):'';
  var seers=FT.seers.filter(function(s){return s.n!==me});
  var sr=seers[ftHash(seed+'|s')%seers.length], sg=guest(sr.n);
  var text=(phase&&ftPersonal(me,phase,seed))||ftPick(FT.common,seed+'|c');
  return {key:seed, seer:sr.n, role:sg.character||sr.n, flavor:ftPick(sr.fl,seed+'|f'), text:text};
}

    }).join(''):'<p class="small muted">Никого.</p>')+'</div></div>'+
    '<div class="card"><h3 style="font-size:18px;margin-bottom:4px">Все гости</h3><p class="small muted" style="margin-bottom:8px">«Глазами»: открыть страницу так, как её видит этот гость.</p><div class="glist">'+d.guests.map(function(x){
      return '<div class="grow"><div>'+avatar(x.name,'sm')+'<span>'+pn(x.name)+(x.status==='нет в чате'?' <span class="chip">нет в чате</span>':'')+'</span></div><span style="display:flex;gap:6px"><button class="btn sm" data-act="viewas" data-name="'+esc(x.name)+'">Глазами</button><button class="btn ghost sm" data-act="status" data-name="'+esc(x.name)+'" data-status="не придёт"'+(S.busy?' disabled':'')+'>Скрыть</button></span></div>';
    }).join('')+'</div></div>'+
    [['what','Одолжено у Ксении'],['pickup','Забрать у Ксении']].map(function(k){ var L=(d.borrowed||[]).filter(function(b){return b[k[0]]}); return L.length?'<div class="card"><h3 style="font-size:18px;margin-bottom:8px">'+k[1]+'</h3><div class="glist">'+L.map(function(b){return '<div class="grow"><span>'+pn(b.name)+'</span><span class="small muted" style="text-align:right">'+esc(b[k[0]])+'</span></div>'}).join('')+'</div></div>':''}).join('')+
    '<div class="card"><h3 style="font-size:18px;margin-bottom:8px">Кто что везёт</h3><div class="glist">'+(d.props||[]).map(function(p){return '<div class="grow"><span>'+esc(p.item)+'</span><span class="small muted">'+p.who.map(esc).join(', ')+'</span></div>'}).join('')+'</div></div>'+
    '<div class="card"><h3 style="font-size:18px;margin-bottom:8px">Все задачи</h3><div class="grid-scroll"><table class="dt"><thead><tr><th>Гильдия</th><th>Задача</th><th>Пт</th><th>Сб</th><th>Вс</th></tr></thead><tbody>'+
      blocks.map(function(b){var ts=tasksOf(b); return ts.map(function(t,i){return '<tr>'+(i===0?'<td class="blk" rowspan="'+ts.length+'">'+esc(guildName(b))+'</td>':'')+'<td>'+esc(t)+'</td><td>'+cell(b,t,'Пт')+'</td><td>'+cell(b,t,'Сб')+'</td><td>'+cell(b,t,'Вс')+'</td></tr>'}).join('')}).join('')+
    '</tbody></table></div></div>'+
    (d.tg?'':'<button class="link" data-act="logout">Выйти из режима организатора</button>');
}

function contactsHtml(){
  var vis=S.visitor&&!S.me&&!S.data.access.admin&&!S.data.host;
  var list=(S.data.contacts||[]).filter(function(c){return c.top&&(!vis||c.name==='Ксения'||c.name==='Айк')});
  if(!list.length) return '';
  return '<div class="contacts" aria-label="Важные контакты">'+list.map(function(c){
    return '<div class="ct">'+avatar(c.name,'sm')+'<div class="who"><b>'+pn(c.name)+'</b><span>'+esc(c.role)+'</span></div><div class="acts">'+
      (c.tg?'<a class="ic tg" href="https://t.me/'+esc(c.tg)+'" data-tg="'+esc(c.tg)+'" target="_blank" rel="noopener" aria-label="Написать '+esc(c.name)+' в Telegram">'+icon('tg')+'</a>':'')+
      (c.phone?'<button class="ic" data-act="phone" data-phone="'+esc(c.phone)+'" aria-label="Телефон '+esc(c.name)+'">'+icon('phone')+'</button>':'')+
    '</div></div>';
  }).join('')+'</div>';
}

function render(){
  var d=S.data; if(!d) return;
  if(!S.switching){ var sw=document.getElementById('switching'); if(sw) sw.remove(); }
  if(!S.qzChecked&&S.me&&!d.viewAs){ S.qzChecked=true; setTimeout(quizRecover,0); }
  var realMe=S.me; S.me=who();
  var tabs=d.tabs.slice(); if(d.access.admin) tabs.push({id:'admin',name:'Штаб'});
  var visitor=S.visitor&&!S.me&&!d.access.admin&&!d.host;
  if(d.host){ tabs=[]; S.tab='host'; S.hostStep=''; }
  var sharedMode=!d.host&&viewingShared(); if(sharedMode){ tabs=[{id:'me',name:'Я'}]; S.tab='me'; }
  else if(visitor){ tabs=tabs.filter(function(t){return t.id==='people'}); if(!tabs.length) tabs=[{id:'people',name:'Роли'}]; S.tab='people'; }
  else if(!tabs.some(function(t){return t.id===S.tab})) S.tab=tabs[0]?tabs[0].id:'me';
  S.locked=!d.host&&!visitor&&!S.me&&!d.access.admin; if(S.locked) S.tab='me';
  var focusId=document.activeElement&&document.activeElement.id, selStart=document.activeElement&&document.activeElement.selectionStart;
  var nm=tabName(S.tab), news=(d.host||visitor||sharedMode)?{top:'',rest:''}:newsFor(nm), body;
  if(S.tab==='me') body=vMe(); else if(S.tab==='plan') body=vPlan(); else if(S.tab==='people') body=vPeople();
  else if(S.tab==='home') body=vHome(); else if(S.tab==='road') body=vRoad(); else if(S.tab==='admin') body=vAdmin(); else if(S.tab==='host') body=vHost(); else body='';
  var dd=d.dates, from=(dd['Пт']||'').slice(0,2).replace(/^0/,''), to=(dd['Вс']||'').slice(0,2).replace(/^0/,'');
  var showAdminLogin=!sharedMode&&!d.access.admin&&!d.tg&&!d.host&&!S.hostStep&&S.tab==='me';
  $app.innerHTML=(demoRaw?'<div class="demo">Демо на данных из таблиц. Код гостей «'+esc(demoRaw.settings['Кодовое слово гостей'])+'», организатора «'+esc(demoRaw.settings['Код организатора'])+'» (вход внизу вкладки «Я»).</div>':'')+
    (visitor?'<div class="demo" style="display:flex;justify-content:center;align-items:center;gap:12px;flex-wrap:wrap">Гостевой вход: роли и викторины<button class="btn sm" data-act="visitorout">Выйти</button></div>':'')+
    (d.viewAs?'<div class="demo" style="display:flex;justify-content:center;align-items:center;gap:12px;flex-wrap:wrap">'+(d.access.admin?'Ты смотришь как <b>'+esc(d.viewAs)+'</b>, только просмотр':'Ты в аккаунте <b>'+esc(d.viewAs)+'</b>')+'<button class="btn sm" data-act="viewas" data-name="">Вернуться к себе</button></div>':'')+
    '<header class="top"><div class="in"><div><span class="eyebrow">'+esc(d.subtitle)+(from?' · '+from+'–'+to+' ноября':'')+'</span><h1>'+esc(d.title)+'</h1></div><div class="now">'+(S.syncing?'<span class="sync" title="обновляю"></span>':'')+nowLine()+'</div></div></header>'+
    (sharedMode?'':contactsHtml())+
    '<main class="wrap"><div class="view">'+news.top+body+news.rest+
      (showAdminLogin?'<div class="foot">'+(S.showAdminLogin?'<form class="codeform" data-form="admin" style="width:min(360px,100%)"><input type="password" id="admininput" placeholder="Код организатора" autocomplete="off" aria-label="Код организатора"><button class="btn" type="submit">Войти</button></form>':'<button class="link" data-act="adminlogin">Вход для организаторов</button>')+'</div>':'')+
    (S.tab==='me'&&CONFIG.build?'<p class="small muted" style="text-align:center;opacity:.6">версия '+CONFIG.build.slice(6,8)+'.'+CONFIG.build.slice(4,6)+' '+CONFIG.build.slice(8,10)+':'+CONFIG.build.slice(10,12)+'</p>':'')+
    '</div></main>'+
    (tabs.length>1?'<nav class="tabbar" aria-label="Вкладки"><div class="in">'+tabs.map(function(t){
      if(S.locked&&t.id!=='me') return '<a role="button" aria-disabled="true" class="off" data-act="locked"><span class="pill">'+icon(I[t.id]?t.id:'plan')+'</span>'+esc(t.name)+'</a>';
      return '<a href="#'+t.id+'" data-act="tab" data-tab="'+t.id+'" class="'+(t.id===S.tab?'on':'')+'"'+(t.id===S.tab?' aria-current="page"':'')+'><span class="pill">'+icon(I[t.id]?t.id:'plan')+'</span>'+esc(t.name)+'</a>';
    }).join('')+'</div></nav>':'');
  gcarSync();
  if(focusId){var el=document.getElementById(focusId); if(el){el.focus(); try{if(selStart!=null) el.setSelectionRange(selStart,selStart)}catch(e){}}}
  S.me=realMe;
}
function goTab(id,sub){ if(S.locked&&id!=='me'){ toast('Сначала выбери себя в списке'); return; } S.tab=id; if(sub) S.homeSeg=sub; LS.set('tab',id); try{history.replaceState(null,'','#'+id)}catch(e){} render(); window.scrollTo(0,0); }

/* ---------- события ---------- */
document.addEventListener('click',function(e){
  var l=e.target.closest('a[target="_blank"]');
  if(l&&TG){ e.preventDefault(); var tg=l.getAttribute('data-tg'); try{ tg?TG.openTelegramLink('https://t.me/'+tg):TG.openLink(l.href) }catch(x){ location.href=l.href } return; }
  if(e.target.closest('#switching')) return;
  var lb=e.target.closest('.lb');
  if(lb){ lb.remove(); if(!e.target.closest('[data-act]')) return; }
  else { var av=e.target.closest('.av'); if(av&&av.querySelector('.ph img')&&!av.closest('button')&&!av.closest('.qz')){ openLb(av.getAttribute('data-name')); return; } }
  var t=e.target.closest('[data-act]'); if(!t) return;
  var a=t.getAttribute('data-act');
  if(a==='locked'){ toast('Сначала выбери себя в списке'); }
  else if(a==='tab'){ e.preventDefault(); goTab(t.getAttribute('data-tab')); }
  else if(a==='goto'){ var tb=t.getAttribute('data-tab'); if(tb==='feast') goTab('home','feast'); else if(tb==='home') goTab('home','rooms'); else goTab(tb); }
  else if(a==='seg'){ S.homeSeg=t.getAttribute('data-seg'); render(); }
  else if(a==='me'){ S.me=t.getAttribute('data-name'); LS.set('me',S.me); var c=null; try{c=JSON.parse(localStorage.getItem('chembalo.'+cacheKey())||'null')}catch(x){} if(c&&!demoRaw){S.data=c} load(); window.scrollTo(0,0); }
  else if(a==='link'){ act({type:'linkTg',name:t.getAttribute('data-name')},'Готово, это ты!'); }
  else if(a==='room'){ S.selRoom=S.selRoom===t.getAttribute('data-id')?'':t.getAttribute('data-id'); render(); }
  else if(a==='editcar'){ var c=S.data.cars.filter(function(x){return x.row===+t.getAttribute('data-row')})[0]; if(c){S.editCar=c.row; S.draft=c.passengers.slice(); S.draftWhen=c.when; render();} }
  else if(a==='cancelcar'){ S.editCar=0; render(); }
  else if(a==='pick'){ var n=t.getAttribute('data-name'), i=S.draft.indexOf(n), cc=S.data.cars.filter(function(x){return x.row===S.editCar})[0];
    if(i>=0) S.draft.splice(i,1); else if(cc&&S.draft.length>=cc.seats) toast('Мест больше нет'); else S.draft.push(n);
    var w=document.getElementById('when'+S.editCar); if(w) S.draftWhen=w.value; render(); }
  else if(a==='savecar'){ var w2=document.getElementById('when'+S.editCar); if(w2) S.draftWhen=w2.value; var row=S.editCar;
    act({type:'setCar',row:row,passengers:S.draft,when:S.draftWhen},'Сохранено'); S.editCar=0; }
  else if(a==='status'){ act({type:'setStatus',name:t.getAttribute('data-name'),status:t.getAttribute('data-status')}, t.getAttribute('data-status')==='придёт'?'Вернули на страницу':'Скрыли со страницы'); }
  else if(a==='phone'){ var ph=t.getAttribute('data-phone'); var done=function(){toast(fmtPhone(ph)+' скопирован')};
    try{ navigator.clipboard.writeText(ph).then(done,function(){toast(fmtPhone(ph))}) }catch(x){ toast(fmtPhone(ph)) } }
  else if(a==='adminlogin'){ S.showAdminLogin=true; render(); var i=document.getElementById('admininput'); if(i) i.focus(); }
  else if(a==='logout'){ S.code=''; LS.set('code',''); goTab('me'); load(); }
  else if(a==='reload'){ location.reload(); }
  else if(a==='lb'){ openLb(t.getAttribute('data-name')); }
  else if(a==='fortune'){ LS.set('fortune',fortune(who()).key); S.ftAnim=true; haptic('success'); render(); setTimeout(function(){S.ftAnim=false},1200); }
  else if(a==='visitor'){ S.visitor=true; LS.set('visitor','1'); S.q=''; render(); window.scrollTo(0,0); }
  else if(a==='visitorout'){ quizClose(true); S.visitor=false; LS.set('visitor',''); S.tab='me'; LS.set('tab','me'); try{history.replaceState(null,'','#me')}catch(x){} render(); window.scrollTo(0,0); }
  else if(a==='hostpick'){ S.hostStep='pick'; render(); window.scrollTo(0,0); }
  else if(a==='hostslot'){ S.hostStep=+t.getAttribute('data-slot'); render(); var hi=document.getElementById('hnickin')||document.getElementById('hkeyin'); if(hi) hi.focus(); }
  else if(a==='hostback'){ S.hostStep=S.hostStep==='pick'?'':'pick'; render(); }
  else if(a==='hostf'){ S.hostF=t.getAttribute('data-f'); render(); }
  else if(a==='hostmark'){ var hn=t.getAttribute('data-name'), mk=t.getAttribute('data-mark'), cur=hostMine(hn).mark;
    hostSend({type:'hostNote',name:hn,mark:cur.indexOf(mk)>=0?cur.replace(mk,''):cur+mk}); }
  else if(a==='hostsave'){ var hn2=t.getAttribute('data-name'), tx=S.hostDraft[hn2]; if(tx==null) return;
    hostSend({type:'hostNote',name:hn2,text:tx},'Заметка сохранена',function(){ delete S.hostDraft[hn2]; }); }
  else if(a==='hostout'){ S.host=''; S.hostKey=''; LS.set('host',''); LS.set('hkey',''); S.hostStep=''; S.tab='me'; S.data=null; $app.innerHTML='<div class="loading">Выхожу…</div>'; load(); }
  else if(a==='qzstart'){ quizStart(t.getAttribute('data-kind')); }
  else if(a==='qzpick'){ quizPick(+t.getAttribute('data-k')); }
  else if(a==='qznext'){ quizNext(); }
  else if(a==='qzclose'){ quizClose(); }
  else if(a==='qzgo'){ S.openQuiz=true; goTab('people'); }
  else if(a==='mgplay'){ playMakar(); }
  else if(a==='qzmakar'){ if(S.switching) return; var nm=sharedName(), wait=(Q&&Q.savePromise)||Promise.resolve();
    S.prevViewAs=S.viewAs; S.switching=nm; quizClose(true); showSwitching();
    wait.then(function(){ S.viewAs=nm; S.editCar=0; S.tab='me'; load().then(function(){ window.scrollTo(0,0); }); }); }
  else if(a==='ask'){ askLb(+t.getAttribute('data-row')); }
  else if(a==='gcday'){ S.gDay=S.gDay||{}; S.gDay[t.getAttribute('data-b')]=t.getAttribute('data-day'); render(); }
  else if(a==='gcgo'){ var el=document.getElementById('gcar'), c=el&&el.children[+t.getAttribute('data-i')]; if(c) el.scrollTo({left:(+t.getAttribute('data-i'))*(c.offsetWidth+10),behavior:'smooth'}); }
  else if(a==='answer'){ var yes=t.getAttribute('data-ans')==='yes'; act({type:'answerTask',row:+t.getAttribute('data-row'),answer:yes?'yes':'no'}, yes?'Спасибо, записали!':'Хорошо, сняли тебя с этой задачи'); }
  else if(a==='char'){ var nm=t.getAttribute('data-name'); S.q=''; goTab('people'); setTimeout(function(){ var el=document.getElementById('char-'+nm); if(el){ el.scrollIntoView({block:'center'}); el.classList.add('flash'); setTimeout(function(){el.classList.remove('flash')},1600);} },30); }
  else if(a==='viewas'){ if(S.switching) return; S.prevViewAs=S.viewAs; S.viewAs=t.getAttribute('data-name'); S.switching=S.viewAs||'self'; showSwitching(); S.editCar=0; if(S.viewAs){ S.tab='me'; } else { S.tab=S.data&&S.data.access.admin?'admin':'me'; }
    if(!S.viewAs){ try{var c=JSON.parse(localStorage.getItem('chembalo.'+cacheKey())||'null'); if(c) S.data=c;}catch(x){} }
    load().then(function(){ window.scrollTo(0,0); }); }
});
document.addEventListener('toggle',function(e){ var t=e.target; if(!t.classList) return; if(t.classList.contains('day-tasks')&&t.getAttribute('data-day')) S.openDays[t.getAttribute('data-day')]=t.open; if(t.classList.contains('story')) S.openNews[t.getAttribute('data-news')]=t.open; if(t.getAttribute('data-ev')) S.openEv[t.getAttribute('data-ev')]=t.open; if(t.getAttribute('data-slot')) S.openSlot[t.getAttribute('data-slot')]=t.open; },true);
document.addEventListener('input',function(e){ if(e.target.id==='q'){ S.q=e.target.value; render(); }
  else if(e.target.id==='hq'){ S.hostQ=e.target.value; render(); }
  else if(e.target.classList&&e.target.classList.contains('hnote')){ var hn=e.target.getAttribute('data-name'); S.hostDraft[hn]=e.target.value;
    var sb=document.querySelector('[data-act="hostsave"][data-name="'+CSS.escape(hn)+'"]'); if(sb) sb.disabled=S.busy||e.target.value===hostMine(hn).text; } else if(e.target.id==='when'+S.editCar){ S.draftWhen=e.target.value; } });
document.addEventListener('submit',function(e){
  var f=e.target.getAttribute('data-form'); if(!f) return; e.preventDefault();
  if(f==='hostnew'||f==='hostlogin'){
    var key=((document.getElementById('hkeyin')||{}).value||'').trim(), nick=((document.getElementById('hnickin')||{}).value||'').trim();
    if(f==='hostnew'&&!nick){ toast('Напиши свой ник'); return; }
    if(!key){ toast('Введи кодовое слово'); return; }
    if(S.busy) return; var slot=S.hostStep; S.busy=true; S.host=String(slot); S.hostKey=key; render();
    var fail=function(m){ S.host=''; S.hostKey=''; toast(m); };
    (f==='hostnew'?api({type:'claimHost',slot:slot,nick:nick,hkey:key}):api()).then(function(d){
      if(!d.host){ fail(f==='hostnew'?'Не получилось занять место':'Не то кодовое слово'); return; }
      LS.set('host',S.host); LS.set('hkey',S.hostKey); accept(d); haptic('success'); toast('Добро пожаловать, '+d.host.nick);
    }).catch(function(err){ fail(err.message); }).then(function(){ S.busy=false; render(); window.scrollTo(0,0); });
    return;
  }
  var v=(document.getElementById(f==='code'?'codeinput':'admininput')||{}).value||'';
  var prev=S.code; S.code=v.trim();
  api().then(function(d){
    var ok = f==='code'? d.access.guest : d.access.admin;
    if(!ok){ S.code=prev; toast('Не то слово. Спроси в чате.'); return; }
    LS.set('code',S.code); accept(d); S.showAdminLogin=false; if(f==='admin') goTab('admin'); else render(); toast(f==='code'?'Адрес открыт':'Добро пожаловать в штаб');
  }).catch(function(err){S.code=prev; toast(err.message)});
});
window.addEventListener('hashchange',function(){ var h=(location.hash||'').slice(1); if(h&&h!==S.tab&&S.data){ S.tab=h; render(); } });
setInterval(function(){ if(S.data && !S.busy && document.visibilityState==='visible' && !(document.activeElement&&/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName))) render(); },60000);
document.addEventListener('visibilitychange',function(){ if(document.visibilityState==='visible'&&S.data&&!S.busy) load(); });

// самообновление: если на GitHub лежит более новая версия страницы, перезагрузиться на неё
if(!CONFIG.demo && CONFIG.build){
  fetch(location.pathname+'?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.text()}).then(function(t){
    var m=t.match(/build:(\d+)/); if(!m||m[1]===CONFIG.build) return;
    try{ if(sessionStorage.getItem('chembalo.reloaded')===m[1]) return; sessionStorage.setItem('chembalo.reloaded',m[1]); }catch(e){}
    location.replace(location.pathname+'?v='+m[1]);
  }).catch(function(){});
}
if(!CONFIG.demo && !CONFIG.api){ $app.innerHTML='<div class="loading">Страница ещё не подключена к таблице.</div>'; return; }
// мгновенный показ: сначала то, что видели в прошлый раз, потом свежие данные
if(!demoRaw){ try{ var cached=JSON.parse(localStorage.getItem('chembalo.'+cacheKey())||'null'); if(cached){ S.data=cached; if(cached.tg) S.me=cached.me; render(); } }catch(e){} }
load();
})();
</script>
</body>
</html>
